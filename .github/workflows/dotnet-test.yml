name: .NET Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, next]

concurrency:
  group: dotnet-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.dotnet }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            dotnet:
              - 'dotnet/**'
              - 'src/commands/**'
              - 'src/postgres/**'
              - 'scripts/**'
              - 'package.json'
              - 'yarn.lock'
              - '.github/workflows/dotnet-test.yml'

  dotnet:
    runs-on: ubuntu-latest
    needs: changes

    name: testing dotnet@${{ matrix.dotnet-version }}, redis@${{ matrix.redis-version }}

    env:
      should_run: ${{ needs.changes.outputs.should_run }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bullmq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [lts/*]
        redis-version: [7-alpine]
        dotnet-version: ['8.0.x']

    steps:
      - name: Skip when dotnet inputs are unchanged
        if: env.should_run != 'true'
        run: echo "No dotnet changes detected; skipping steps."

      - name: Checkout repository
        if: env.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        if: env.should_run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Setup .NET ${{ matrix.dotnet-version }}
        if: env.should_run == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Start Redis
        if: env.should_run == 'true'
        uses: supercharge/redis-github-action@bc274cb7238cd63a45029db04ee48c07a72609fd # 1.8.1
        with:
          redis-version: ${{ matrix.redis-version }}

      - name: Install Node dependencies
        if: env.should_run == 'true'
        run: yarn install --ignore-engines --frozen-lockfile --non-interactive

      - name: Build shared scripts
        if: env.should_run == 'true'
        run: yarn build

      - name: Copy runtime artifacts for .NET
        if: env.should_run == 'true'
        run: |
          yarn copy:lua:dotnet
          yarn copy:sql:dotnet

      - name: Restore
        if: env.should_run == 'true'
        working-directory: dotnet
        run: dotnet restore

      - name: Build
        if: env.should_run == 'true'
        working-directory: dotnet
        run: dotnet build --no-restore --configuration Release

      - name: Test
        if: env.should_run == 'true'
        working-directory: dotnet
        env:
          BULLMQ_TEST_REDIS: localhost:6379
          BULLMQ_TEST_POSTGRES: Host=localhost;Port=5432;Database=bullmq_test;Username=postgres;Password=postgres
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"
