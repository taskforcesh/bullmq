name: Valkey Glide NodeJS Tests

on:
  push:
    branches: [master]
    paths:
      - 'src/commands/**/*.lua'
      - 'package.json'
      - 'yarn.lock'
      - 'scripts/**'
      - '.github/workflows/test.yml'
      - '.github/workflows/valkey-glide-test.yml'
      - 'src/**'
      - 'tests/**'
      - 'tsconfig*.json'
      - 'vitest*.ts'
      - 'bun-test-preload.ts'
      - 'mocha.setup.ts'
      - '.mocharc.js'
      - 'eslint.config.mjs'
  pull_request:
    branches: [master, next]
    paths:
      - 'src/commands/**/*.lua'
      - 'package.json'
      - 'yarn.lock'
      - 'scripts/**'
      - '.github/workflows/test.yml'
      - '.github/workflows/valkey-glide-test.yml'
      - 'src/**'
      - 'tests/**'
      - 'tsconfig*.json'
      - 'vitest*.ts'
      - 'bun-test-preload.ts'
      - 'mocha.setup.ts'
      - '.mocharc.js'
      - 'eslint.config.mjs'

permissions:
  contents: read

jobs:
  valkey-glide:
    runs-on: ubuntu-latest

    name: testing valkey-glide node@lts/*

    services:
      valkey:
        image: valkey/valkey:8-alpine3.20
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'yarn'
      - run: yarn install --ignore-engines --frozen-lockfile --non-interactive
      - run: npm install --no-save @valkey/valkey-glide@2.5.0
      - run: yarn build
      - run: yarn test:valkey-glide
