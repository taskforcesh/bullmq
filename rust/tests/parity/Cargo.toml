[package]
name = "bullmq-parity-tests"
description = "Peachy tests for BullMQ"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"

[dependencies]
bullmq-official = { path = "../.." }
futures = "0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["full"] }
uuid = { version = "1.8.0", features = ["v4"] }
