[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bullmq"
version = "3.0.4"
description='BullMQ for Python'
readme="README.md"
authors = [
    {name = "Taskforce.sh Inc.", email = "manast@taskforce.sh"},
]
requires-python = ">=3.10.0"
classifiers=[
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: Python :: 3.10',
]
keywords = ["python", "bullmq", "queues"]
dependencies = [
    "redis ==7.4.1",
    "msgpack ==1.2.1",
    "semver ==3.0.4",
    "croniter ==2.0.7"
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.6.1",
    "build==1.5.0",
    "types-redis==4.6.0.20241004",
    "pipenv==2026.7.1",
    "virtualenv==21.7.2",
    "virtualenv-clone==0.5.7"
]
test = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0"
]
postgres = [
    "psycopg[binary] ==3.3.4"
]

[project.urls]
"Homepage" = "https://bullmq.io"
"Bug Tracker" = "https://github.com/taskforcesh/bullmq/issues"

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.setuptools.package-data]
bullmq = ["commands/*.lua", "types/*", "postgres/commands/*.sql", "postgres/migrations/*.sql"]
